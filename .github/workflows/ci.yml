name: CI

on:
  push:
    branches:
      - main
      - next
    tags:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build
        run: wasm-pack build --target nodejs --out-dir pkg

  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        target: [bundler, nodejs, web]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - if: ${{ matrix.target != 'nodejs' }}
        name: Optimize for size
        run: echo "opt-level = \"z\"" >> Cargo.toml

      - name: Build & zip
        run: |
          wasm-pack build --release --target ${{ matrix.target }} --out-dir pkg
          ls -ghG pkg
          tar -czvf rosu_pp_js_${{ matrix.target }}.tar.gz -C pkg .

      - name: Upload tarballs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: rosu_pp_js_${{ matrix.target }}
          path: rosu_pp_js_${{ matrix.target }}.tar.gz

  release:
    name: Release
    needs: [check, build]
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: tars

      - name: Upload to github release
        uses: softprops/action-gh-release@v2
        with:
          files: tars/*.tar.gz
